spring:
  application:
    name: gamer


  datasource:
    url: jdbc:postgresql://localhost:5432/biblioteca_gamer
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.4-nano
          temperature:

  logging:
    level:
      org:
        springframework:
          ai:
            chat:
              client:
                advisor: DEBUG